# Conda environment for reproducing the published analysis.
# Versions without a pin were not recorded for the original analysis.
#
# Create and activate with:
#   conda env create -f environment.yml
#   conda activate ssc_somatic

name: ssc_somatic
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pandas=2.3.0
  - numpy=1.26.4
  - scipy=1.11.4
  - matplotlib=3.9.4
  - seaborn=0.13.2
  - statsmodels=0.14.4
  - scikit-learn>=1.2
  - gseapy>=1.0
  - pyyaml>=6.0
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - -e .
